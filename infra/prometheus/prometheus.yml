global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nexuspanel-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']

  - job_name: 'nexuspanel-nodes'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8443']
