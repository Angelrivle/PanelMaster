version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuspassword123
      POSTGRES_DB: nexuspanel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexuspanel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://nexus:nexuspassword123@postgres:5432/nexuspanel?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-32-bytes-minimum-length-here
      MASTER_ENCRYPTION_KEY: 01234567890123456789012345678901
    ports:
      - "3000:3000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nexus-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
      - "5174:80"

volumes:
  pgdata:
  redisdata:
